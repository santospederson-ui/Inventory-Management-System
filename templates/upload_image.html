{% extends 'base.html' %}

{% block content %}

<style>
.upload-card {
    max-width: 750px;
    margin: auto;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.upload-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3c72;
    margin-bottom: 20px;
}

.upload-box {
    border: 2px dashed #cbd5e0;
    border-radius: 10px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    background: #f8fafc;
}

.upload-box:hover {
    border-color: #1e3c72;
    background: #f1f5f9;
}

.upload-box i {
    font-size: 40px;
    color: #1e3c72;
    margin-bottom: 10px;
}

.preview-area {
    margin-top: 15px;
}

.preview-img {
    max-width: 220px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.pdf-badge {
    display: inline-block;
    padding: 8px 12px;
    background: #ff6b6b;
    color: white;
    border-radius: 6px;
    margin-top: 10px;
    text-decoration: none;
}
</style>

<div class="upload-card">

    <div class="upload-title">
        📤 Upload Document
    </div>

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_image') }}">

        <!-- DESCRIPTION -->
        <label>Full Description</label>
        <textarea name="description" class="form-control mb-3" rows="3" required></textarea>

        <!-- UPLOAD AREA -->
        <input type="file"
               id="fileInput"
               name="file"
               accept="image/*,application/pdf"
               hidden
               onchange="previewFile(event)">

        <label for="fileInput" class="upload-box">
            <i class="fas fa-cloud-upload-alt"></i>
            <div><strong>Click to Upload</strong> or Drag & Drop</div>
            <small>Supports Images & PDF</small>
        </label>

        <div id="fileName" style="margin-top:10px;color:#555;"></div>

        <!-- PREVIEW -->
        <div id="previewBox" class="preview-area"></div>

        <!-- REMARK -->
        <label class="mt-3">Remark</label>
        <input type="text" name="remark" class="form-control mb-3">

        <!-- BUTTON -->
        <button type="submit" class="btn btn-success w-100">
            Save Record
        </button>

    </form>
</div>

<script>
function openPreview(url) {

    let box = document.getElementById("previewContainer");

    // ⭐ Force original quality (no compression)
    let highQualityUrl = url.replace("/upload/", "/upload/f_auto,q_auto:best/");

    box.innerHTML = `
        <img src="${highQualityUrl}"
             style="width:100%;height:auto;border-radius:8px;">
    `;

    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
    document.getElementById("previewContainer").innerHTML = "";
}
</script>

{% endblock %}
