{% extends 'base.html' %}

{% block content %}

<style>
.upload-card {
    max-width: 750px;
    margin: auto;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.upload-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3c72;
    margin-bottom: 20px;
}

.upload-box {
    border: 2px dashed #cbd5e0;
    border-radius: 10px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    background: #f8fafc;
    transition: 0.3s;
}

.upload-box:hover {
    border-color: #1e3c72;
}

.preview-img {
    max-width: 100%;
    margin-top: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.file-name {
    margin-top: 10px;
    color: #555;
}
</style>

<div class="upload-card">

    <div class="upload-title">📤 Upload Image</div>

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_image') }}">

        <!-- DESCRIPTION -->
        <label>Description</label>
        <textarea name="description" class="form-control mb-3" rows="3" required></textarea>

        <!-- FILE INPUT -->
        <input type="file"
               id="fileInput"
               name="file"
               accept="image/*"
               hidden
               onchange="previewImage(event)">

        <label for="fileInput" class="upload-box">
            <div><strong>Click to Upload Image</strong></div>
            <small>JPG, PNG, WEBP, GIF</small>
        </label>

        <!-- FILE NAME -->
        <div id="fileName" class="file-name"></div>

        <!-- IMAGE PREVIEW -->
        <div id="previewBox"></div>

        <!-- REMARK -->
        <label class="mt-3">Remark</label>
        <input type="text" name="remark" class="form-control mb-3">

        <button type="submit" class="btn btn-success w-100">
            Upload Image
        </button>

    </form>
</div>

<script>
function previewImage(event) {
    let file = event.target.files[0];
    let previewBox = document.getElementById("previewBox");
    let fileName = document.getElementById("fileName");

    previewBox.innerHTML = "";

    if (!file) return;

    fileName.innerText = "Selected: " + file.name;

    // IMAGE PREVIEW (LOCAL BEFORE UPLOAD)
    let img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.className = "preview-img";

    previewBox.appendChild(img);
}
</script>

{% endblock %}
