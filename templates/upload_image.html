{% extends 'base.html' %}

{% block content %}

<style>
.upload-card {
    max-width: 750px;
    margin: auto;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.upload-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3c72;
    margin-bottom: 20px;
}
</style>

<div class="upload-card">

    <div class="upload-title">📄 Add PDF Record</div>

    <form method="POST" action="{{ url_for('upload_image') }}">

        <!-- DESCRIPTION -->
        <label>Description</label>
        <textarea
            name="description"
            class="form-control mb-3"
            rows="3"
            required></textarea>

        <!-- PDF FILE NAME -->
        <label>PDF Filename</label>
        <input
            type="text"
            name="filename"
            class="form-control mb-3"
            placeholder="example.pdf"
            required>

        <small class="text-muted">
            Place the PDF file inside:
            <strong>static/pdfs/</strong>
        </small>

        <!-- REMARK -->
        <label class="mt-3">Remark</label>
        <input
            type="text"
            name="remark"
            class="form-control mb-3">

        <!-- SAVE BUTTON -->
        <button type="submit" class="btn btn-success w-100">
            Save Record
        </button>

    </form>

</div>

{% endblock %}
