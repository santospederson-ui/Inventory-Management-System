{% extends 'base.html' %}

{% block content %}

<h3>Upload Any File</h3>

<form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_file') }}">

    <!-- DESCRIPTION -->
    <textarea name="description" class="form-control" placeholder="Full description" required></textarea>

    <br>

    <!-- FILE INPUT -->
    <input type="file"
           id="fileInput"
           name="file"
           style="display:none;"
           onchange="showName(this)">

    <label for="fileInput" class="btn btn-primary">
        Choose File
    </label>

    <span id="fileName" style="margin-left:10px;">No file selected</span>

    <br><br>

    <!-- REMARK -->
    <input type="text" name="remark" class="form-control" placeholder="Remark">

    <br>

    <button type="submit" class="btn btn-success">
        Upload
    </button>

</form>

<script>
function showName(input) {
    let file = input.files[0];
    document.getElementById("fileName").innerText = file ? file.name : "No file selected";
}
</script>

{% endblock %}
