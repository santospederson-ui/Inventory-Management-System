{% extends 'base.html' %}

{% block content %}

<h3>Upload Any File</h3>

<form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_file') }}">

    <!-- DESCRIPTION -->
    <textarea name="description"
              class="form-control"
              placeholder="Full description"
              required></textarea>

    <br>

    <!-- FILE INPUT (hidden) -->
    <input type="file"
           id="fileInput"
           name="file"
           accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.xlsx"
           style="display:none;"
           onchange="showName(this)">

    <!-- BUTTON TO OPEN FILE -->
    <label for="fileInput" class="btn btn-primary">
        Choose File
    </label>

    <!-- FILE NAME DISPLAY -->
    <span id="fileName" style="margin-left:10px; color:#666;">
        No file selected
    </span>

    <br><br>

    <!-- REMARK -->
    <input type="text"
           name="remark"
           class="form-control"
           placeholder="Remark">

    <br>

    <!-- SUBMIT BUTTON -->
    <button type="submit" class="btn btn-success" id="submitBtn" disabled>
        Upload
    </button>

</form>

<script>
function showName(input) {
    let file = input.files[0];

    let fileName = document.getElementById("fileName");
    let submitBtn = document.getElementById("submitBtn");

    if (file) {
        fileName.innerText = file.name;
        submitBtn.disabled = false;
    } else {
        fileName.innerText = "No file selected";
        submitBtn.disabled = true;
    }
}
</script>

{% endblock %}
