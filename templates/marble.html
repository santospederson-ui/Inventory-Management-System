{% if session.get('role') == 'admin' %}
<td>
    <div class="action-buttons">

        <!-- Edit -->
        <a href="{{ url_for('edit_marble', id=item.id) }}"
           class="btn btn-edit"
           title="Edit">
            <i class="fas fa-edit"></i> Edit
        </a>

        <!-- Withdraw -->
        <a href="{{ url_for('withdraw_marble', id=item.id) }}"
           class="btn btn-withdraw"
           title="Withdraw">
            <i class="fas fa-arrow-alt-circle-up"></i> Withdraw
        </a>

        <!-- Return -->
        <a href="{{ url_for('return_marble', id=item.id) }}"
           class="btn btn-return"
           title="Return Marble">
            <i class="fas fa-undo-alt"></i> Return
        </a>

        <!-- Delete -->
        <a href="{{ url_for('delete_marble', id=item.id) }}"
           class="btn btn-delete"
           onclick="return confirm('Delete this marble item?')"
           title="Delete">
            <i class="fas fa-trash"></i> Delete
        </a>

    </div>
</td>
{% endif %}
