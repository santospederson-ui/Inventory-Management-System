{% extends 'base.html' %}

{% block content %}

<style>
    .form-card {
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        max-width: 700px;
        margin: 0 auto;
    }

    .form-card h1 {
        color: #1e3c72;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 1.8rem;
    }

    .form-subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    .form-group label {
        font-weight: 600;
        color: #1e3c72;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        border: 2px solid #e0e0e0;
        margin-bottom: 20px;
    }

    .form-control:focus {
        border-color: #ffc107;
        outline: none;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #FF6B6B 0%, #EE5A6F 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit:hover {
        transform: translateY(-3px);
    }
</style>

<div class="form-card">

    <h1>
        <i class="fas fa-arrow-circle-down" style="color:#ff4757; margin-right:10px;"></i>
        Withdraw Marble
    </h1>

    <p class="form-subtitle">
        Reduce stock and log withdrawal
    </p>

    <!-- ITEM INFO -->
    <div style="background:#f5f9ff; padding:15px; border-radius:8px; margin-bottom:20px;">
        <strong>Description:</strong> {{ item.description }} <br>
        <strong>Available Qty:</strong> {{ item.qty }}
    </div>

    <form method="POST">

        <!-- QUANTITY -->
        <div class="form-group">
            <label>Withdraw Quantity</label>
            <input type="number"
                   name="qty"
                   class="form-control"
                   min="0.01"
                   step="0.01"
                   required>
        </div>

        <!-- PROJECT (THIS FIXES YOUR ERROR) -->
        <div class="form-group">
            <label>Project *</label>
            <input type="text"
                   name="project"
                   class="form-control"
                   placeholder="Enter project name"
                   required>
        </div>

        <!-- REMARK -->
        <div class="form-group">
            <label>Remark</label>
            <textarea name="remark"
                      class="form-control"
                      rows="3"
                      placeholder="Optional notes"></textarea>
        </div>

        <button type="submit" class="btn-submit">
            Withdraw Marble
        </button>

    </form>

</div>

{% endblock %}
