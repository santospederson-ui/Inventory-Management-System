{% extends 'base.html' %}

{% block content %}

<style>
    .form-card {
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        max-width: 600px;
        margin: 0 auto;
    }

    .form-card h1 {
        color: #1e3c72;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 1.8rem;
    }

    .item-info {
        background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
        border-left: 4px solid #ffc107;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
    }

    .info-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #e0e0e0;
    }

    .info-item:last-child {
        border-bottom: none;
    }

    .info-label {
        font-weight: 600;
        color: #1e3c72;
    }

    .info-value {
        color: #666;
    }

    .form-group label {
        color: #1e3c72;
        font-weight: 600;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px 15px;
        transition: all 0.3s ease;
        margin-bottom: 20px;
        width: 100%;
    }

    .form-control:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.15);
        outline: none;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
    }

    .form-hint {
        color: #999;
        font-size: 0.85rem;
        margin-top: -15px;
        margin-bottom: 15px;
    }
</style>

<div class="form-card">
    <h1>
        <i class="fas fa-plus-square" style="color: #ffc107; margin-right: 10px;"></i>
        Add Tile Stock
    </h1>

    <div class="item-info">

        <div class="info-item">
            <span class="info-label">
                <i class="fas fa-ruler-combined" style="color: #ffc107; margin-right: 8px;"></i>
                Size
            </span>
            <span class="info-value">
                <strong>{{ item.size }}</strong>
            </span>
        </div>

        <div class="info-item">
            <span class="info-label">
                <i class="fas fa-layer-group" style="color: #ffc107; margin-right: 8px;"></i>
                Type
            </span>
            <span class="info-value">
                {{ item.type }}
            </span>
        </div>

        <div class="info-item">
            <span class="info-label">
                <i class="fas fa-info-circle" style="color: #ffc107; margin-right: 8px;"></i>
                Description
            </span>
            <span class="info-value">
                {{ item.description }}
            </span>
        </div>

        <div class="info-item">
            <span class="info-label">
                <i class="fas fa-boxes" style="color: #ffc107; margin-right: 8px;"></i>
                Current Qty
            </span>
            <span class="info-value">
                <span class="badge" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 6px 12px;">
                    {{ item.qty }}
                </span>
            </span>
        </div>

    </div>

    <form method="POST">

        <div class="form-group">
            <label>
                <i class="fas fa-box-open" style="color: #ffc107; margin-right: 8px;"></i>
                Quantity to Add *
            </label>

            <input type="number"
                   name="qty"
                   class="form-control"
                   step="0.01"
                   placeholder="Enter quantity to add"
                   min="1"
                   required>

            <div class="form-hint">
                Enter the quantity of tiles being added.
            </div>
        </div>

        <div class="form-group">
            <label>
                <i class="fas fa-sticky-note" style="color: #ffc107; margin-right: 8px;"></i>
                Remark / Reason *
            </label>

            <textarea name="remark"
                      class="form-control"
                      rows="3"
                      placeholder="New stock, supplier delivery, stock correction, etc."
                      required></textarea>

            <div class="form-hint">
                Reason for adding stock.
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-check"></i>
            Confirm Tile Stock Addition
        </button>

    </form>
</div>

{% endblock %}
