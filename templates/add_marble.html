<form method="POST">

    <div class="form-group">
        <label>
            <i class="fas fa-info-circle" style="color:#ffc107; margin-right:8px;"></i>
            Description *
        </label>

        <input type="text"
               name="description"
               class="form-control"
               placeholder="Enter marble description"
               required>

        <div class="form-hint">
            Example: Carrara White Marble 600x600
        </div>
    </div>

    <div class="form-group">
        <label>
            <i class="fas fa-weight" style="color:#ffc107; margin-right:8px;"></i>
            Quantity *
        </label>

        <input type="number"
               name="qty"
               class="form-control"
               placeholder="Enter quantity"
               min="0"
               step="0.01"
               required>

        <div class="form-hint">
            Available quantity in stock
        </div>
    </div>

    <div class="form-group">
        <label>
            <i class="fas fa-project-diagram" style="color:#ffc107; margin-right:8px;"></i>
            Project *
        </label>

        <input type="text"
               name="project"
               class="form-control"
               placeholder="Enter project name"
               required>

        <div class="form-hint">
            Example: Villa Project A / Site 12
        </div>
    </div>

    <div class="form-group">
        <label>
            <i class="fas fa-sticky-note" style="color:#ffc107; margin-right:8px;"></i>
            Remark
        </label>

        <textarea name="remark"
                  class="form-control"
                  rows="4"
                  placeholder="Additional notes or remarks"></textarea>

        <div class="form-hint">
            Optional notes about the marble item
        </div>
    </div>

    <button type="submit" class="btn-submit">
        <i class="fas fa-save"></i>
        Save Marble Item
    </button>

</form>
