{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header text-center">

                <h3>Create New User</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Full Name</label>

                        <input type="text"
                               name="fullname"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button class="btn btn-success w-100">

                        Register

                    </button>

                </form>

                <hr>

                <a href="{{ url_for('login') }}"
                   class="btn btn-secondary w-100">

                    Back To Login

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
